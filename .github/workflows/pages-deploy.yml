name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# This repo holds the private source. The built site is encrypted and pushed
# to the public ReidGlaze.github.io repo, which GitHub Pages serves as is.
env:
  PUBLIC_REPO: ReidGlaze/ReidGlaze.github.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        run: |
          [ -n "$STATICRYPT_PASSWORD" ] || { echo "Missing STATICRYPT_PASSWORD secret"; exit 1; }
          [ -n "$PUBLIC_REPO_TOKEN" ] || { echo "Missing PUBLIC_REPO_TOKEN secret"; exit 1; }
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: bundle exec jekyll b -d _site
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site --disable-external --check-html --allow_hash_href

      # Images are embedded in the pages so they are encrypted along with them.
      - name: Embed images
        run: |
          pip install pillow
          python3 tools/inline-images.py _site

      # Password protect the whole site. Files that would expose post content
      # without going through an encrypted page are removed first.
      - name: Encrypt site
        run: |
          rm -f _site/feed.xml _site/sitemap.xml _site/assets/js/data/search.json
          npx --yes staticrypt@3.5.4 _site -r -d _encrypted \
            --short --remember 30 \
            --template-title "Reid Glaze" \
            --template-instructions "This portfolio is password protected."
          cp -r _encrypted/_site/. _site/
          # Tick "Remember me" by default so one login covers every page.
          find _site -name '*.html' -exec sed -i \
            's|<input id="staticrypt-remember" type="checkbox" name="remember" />|<input id="staticrypt-remember" type="checkbox" name="remember" checked />|' {} +
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

      # Replace the public repo with a single commit of the encrypted site, so
      # it never holds any readable history.
      - name: Publish to public repo
        run: |
          cd _site
          touch .nojekyll
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy encrypted site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_REPO}.git" main
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
